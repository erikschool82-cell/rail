<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAIL</title>
<meta name="description" content="A personal wardrobe archive.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RAIL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&display=swap">
<style>
/* Layout: archive panels edge to edge, 1px hairlines, square corners, photos on a neutral well. Mobile first. */
:root {
  --paper: #ffffff;
  --ink: #000000;
  --mute: #737373;
  --line: #dcdcdc;
  --well: #efefef;
  --alert: #c8102e;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --bar: 56px;
  --top: 52px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0b0b0b; --ink: #f2f2f2; --mute: #8f8f8f; --line: #2a2a2a; --well: #171717; --alert: #ff5a6e; color-scheme: dark } }
:root[data-theme="dark"] { --paper: #0b0b0b; --ink: #f2f2f2; --mute: #8f8f8f; --line: #2a2a2a; --well: #171717; --alert: #ff5a6e; color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { margin: 0; font: 400 13px/18px var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; margin: 0; }
button { cursor: pointer; padding: 0; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
::selection { background: var(--ink); color: var(--paper); }
.label { font-size: 11px; line-height: 14px; letter-spacing: .07em; text-transform: uppercase; font-weight: 500; }
.mute { color: var(--mute); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: stretch; height: var(--top); }
.top-row > * { display: flex; align-items: center; }
.word { font-weight: 500; font-size: 15px; letter-spacing: .2em; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; border-right: 1px solid var(--line); }
.count { padding: 0 12px; gap: 6px; }
.tbtn { padding: 0 14px; border-left: 1px solid var(--line); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.grow { flex: 1; min-width: 0; }
.search { border-top: 1px solid var(--line); display: flex; height: 44px; }
.search input { flex: 1; min-width: 0; padding: 0 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); font-size: 16px; }
.search input::placeholder { color: var(--mute); }
.title { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px; }
.back { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; border-right: 1px solid var(--line); color: var(--mute); }

/* Bottom bar */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--paper); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); height: calc(var(--bar) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--mute); text-decoration: none;
  font-size: 10px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; }
.nav a::before { content: ""; width: 4px; height: 4px; background: transparent; }
.nav a[aria-current="page"] { color: var(--ink); }
.nav a[aria-current="page"]::before { background: var(--ink); }
.fab { position: fixed; z-index: 31; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 16px);
  height: 44px; padding: 0 18px; background: var(--ink); color: var(--paper); display: flex; align-items: center; text-decoration: none; }
main { padding-bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 76px); min-height: 100vh; }

/* Grids */
.masonry { display: flex; gap: 8px; padding: 8px max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px)); }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.archive { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.archive .card { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.archive .card:nth-child(3n) { border-right: 0; }
.card { display: block; color: inherit; text-decoration: none; min-width: 0; }
.card:active .well img { opacity: .8; }
.well { position: relative; width: 100%; max-width: 100%; background: var(--well); overflow: hidden; }
.well img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .16s ease-out; }
.well img.on { opacity: 1; }
.well .none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.cap { padding: 7px 4px 10px; min-width: 0; }
.archive .cap { padding: 6px 8px 9px; }
.cap .b, .cap .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cap .b { font-size: 10px; line-height: 13px; letter-spacing: .07em; text-transform: uppercase; font-weight: 500; }
.cap .b + .n { color: var(--mute); }
.fav-dot { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; background: var(--ink); }

/* Panels and empty states */
.empty { padding: 48px 16px; display: flex; justify-content: center; }
.box { border: 1px solid var(--line); width: 100%; max-width: 380px; }
.box > * { padding: 14px 16px; }
.box > * + * { border-top: 1px solid var(--line); }
.box p { margin: 0; color: var(--mute); }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 16px; border: 1px solid var(--ink);
  font-size: 11px; letter-spacing: .07em; text-transform: uppercase; font-weight: 500; color: var(--ink); text-decoration: none; }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.full { width: 100%; }
.btn:disabled { opacity: .35; pointer-events: none; }
.btn.danger { border-color: var(--alert); background: var(--alert); color: #fff; }

/* Sheet (filters) */
.scrim { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--ink) 35%, transparent); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--paper); border-top: 1px solid var(--ink);
  max-height: 82vh; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; height: 48px; border-bottom: 1px solid var(--line); }
.sheet-body { overflow-y: auto; }
.group { padding: 14px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.group > .label { margin-bottom: 10px; display: block; color: var(--mute); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 32px; padding: 0 11px; border: 1px solid var(--line); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
a.chip { color: inherit; text-decoration: none; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .sw { width: 10px; height: 10px; border: 1px solid var(--line); }
.chip .n { color: var(--mute); font-size: 11px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.cap1::first-letter { text-transform: uppercase; }

/* Forms */
.row { padding: 12px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.row > .label { display: block; color: var(--mute); margin-bottom: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.two .row { border-bottom: 0; }
.two .row + .row { border-left: 1px solid var(--line); padding-left: 16px; }
.field { width: 100%; font-size: 16px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.field:focus { outline: none; border-bottom-color: var(--ink); }
textarea.field { min-height: 72px; resize: vertical; }
.colour { display: flex; align-items: center; gap: 12px; }
.colour input[type=color] { width: 48px; height: 32px; padding: 0; border: 1px solid var(--line); }
.actions { position: sticky; bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr 1fr; background: var(--line); gap: 1px; border-top: 1px solid var(--line); z-index: 5; }
.actions button { height: 52px; background: var(--paper); }
.actions button.solid { background: var(--ink); color: var(--paper); }
.actions button:disabled { opacity: .4; }
.batch-link { display: block; width: 100%; text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); text-decoration: none; }
.brow { display: grid; grid-template-columns: 72px minmax(0, 1fr) 32px; gap: 12px; align-items: start; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.brow .shot { aspect-ratio: 4 / 5; }
.brow .x { width: 32px; height: 32px; font-size: 16px; }
.brow select.field { margin-top: 6px; font-size: 14px; }
.brow.saved { opacity: .35; }
.err { color: var(--alert); padding: 12px 16px; border-bottom: 1px solid var(--line); }
.more { padding: 14px 16px; display: block; text-decoration: underline; text-underline-offset: 4px; }

/* Photo picker */
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.shot { position: relative; background: var(--well); aspect-ratio: 4 / 5; max-width: 100%; }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.shot .tag { position: absolute; left: 6px; top: 6px; background: var(--paper); padding: 2px 5px; }
.shot .x { position: absolute; right: 0; top: 0; width: 32px; height: 32px; background: var(--paper); font-size: 16px; }
.shot.add { display: flex; align-items: center; justify-content: center; background: var(--paper); color: var(--mute); }
.pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; aspect-ratio: 4 / 3; max-width: 100%; width: 100%; background: var(--well); border-bottom: 1px solid var(--line); }

/* Detail */
.carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; background: var(--well); }
.carousel::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: start; }
.dots { display: flex; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.dots span { flex: 1; height: 3px; background: var(--paper); }
.dots span.on { background: var(--ink); }
.photobar { display: flex; height: 44px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.photobar > * { display: flex; align-items: center; padding: 0 10px; white-space: nowrap; border-right: 1px solid var(--line); }
.photobar > *:last-child { border-right: 0; }
.head { padding: 18px 16px; border-bottom: 1px solid var(--line); }
.head h1 { margin: 2px 0 0; font-size: 22px; line-height: 27px; font-weight: 400; text-wrap: balance; }
.meta { margin-top: 8px; display: flex; gap: 12px; }
.quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.quad button { height: 46px; background: var(--paper); }
.quad button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.quad .del { color: var(--alert); }
.confirm { background: var(--well); padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.confirm .btns { display: flex; gap: 8px; }
dl { margin: 0; }
.fact { display: grid; grid-template-columns: 104px 1fr; padding: 10px 16px; border-bottom: 1px solid var(--line); gap: 8px; }
.fact dt { color: var(--mute); padding-top: 1px; }
.fact dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.swatch { display: inline-block; width: 11px; height: 11px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 6px; }
.missing { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); text-align: left; }
.notes { padding: 14px 16px; border-bottom: 1px solid var(--line); white-space: pre-wrap; }

/* Profile */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.stats div { background: var(--paper); padding: 18px 16px; }
.stats .v { font-size: 24px; line-height: 28px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.bars li { display: grid; grid-template-columns: 112px 1fr 28px; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.bars { list-style: none; margin: 0; padding: 0; }
.bars .t { height: 3px; background: var(--line); }
.bars .t i { display: block; height: 100%; background: var(--ink); }
.bars .c { text-align: right; font-variant-numeric: tabular-nums; color: var(--mute); }
.status-note { padding: 10px 16px; border-bottom: 1px solid var(--line); }
.update { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top)); z-index: 19; display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--paper); min-height: 44px; padding-block: 6px; }
.update span { flex: 1; min-width: 0; }
.update button { height: 32px; padding: 0 12px; border: 1px solid var(--paper); }
.version { display: flex; align-items: center; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); margin-top: 24px; }
.version span { flex: 1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 72px); z-index: 60;
  background: var(--ink); color: var(--paper); padding: 10px 14px; max-width: calc(100% - 32px); }

/* Wider screens: rail on the left, more columns */
@media (min-width: 900px) {
  .nav { top: 0; bottom: 0; right: auto; width: 176px; height: auto; grid-template-columns: 1fr; grid-auto-rows: 40px; align-content: start;
    padding-top: calc(env(safe-area-inset-top, 0px) + 60px); border-top: 0; border-right: 1px solid var(--line); }
  .nav a { flex-direction: row; justify-content: flex-start; padding-left: 18px; font-size: 11px; gap: 8px; }
  .nav a::before { width: 5px; height: 5px; }
  body { padding-left: 176px; }
  .fab { right: auto; left: 16px; bottom: 16px; width: 144px; justify-content: center; }
  main { padding-bottom: 40px; }
  .archive { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .archive .card:nth-child(3n) { border-right: 1px solid var(--line); }
  .masonry, .col { gap: 16px; }
  .masonry { padding: 16px; }
  .detail { display: grid; grid-template-columns: minmax(0, 7fr) minmax(340px, 4fr); }
  .detail > section:first-child { border-right: 1px solid var(--line); }
  .actions { bottom: 0; }
  .sheet { left: auto; width: 420px; top: 0; max-height: none; border-top: 0; border-left: 1px solid var(--ink); }
  .toast { bottom: 32px; }
  .form-wrap { max-width: 640px; border-right: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { .well img { transition: none; } }
html { padding-top: env(safe-area-inset-top, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
.install { padding-block: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
.install span { flex: 1; min-width: 0; }
.tools { display: grid; gap: 8px; padding-block: 16px; }
</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="update gut" id="update" role="status" hidden><span id="update-text"></span><button class="label" id="update-btn">Update</button></div>
<main id="main" aria-live="polite"></main>
<nav class="nav" id="nav" aria-label="Sections">
  <a href="#wardrobe" data-v="wardrobe">Wardrobe</a>
  <a href="#lists" data-v="lists">Lists</a>
  <a href="#boards" data-v="boards">Boards</a>
  <a href="#outfits" data-v="outfits">Outfits</a>
  <a href="#profile" data-v="profile">Profile</a>
</nav>
<a class="fab label" id="fab" href="#add">+ Add piece</a>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>

  brown: "#6b4a32", navy: "#1d2a44", blue: "#3a5fa0", green: "#3d6b4a", olive: "#6b6b3a", red: "#b3242a",

// ---------- Colour: OKLCH so distances match what the eye sees ----------
function oklch(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lin = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { const s = v / 255; return s <= 0.04045 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; });
  const [r, g, b] = lin;
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s;
  const A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;
  const B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
  let H = Math.atan2(B, A) * 180 / Math.PI; if (H < 0) H += 360;
  return { l: L, c: Math.hypot(A, B), h: H };
}
function family(hex) {
  if (!/^#[0-9a-f]{6}$/i.test(hex || "")) return null;
  const { l, c, h } = oklch(hex);
  if (c < 0.03) return l < 0.3 ? "black" : l < 0.5 ? "charcoal" : l < 0.85 ? "grey" : "white";
  if (h >= 50 && h < 100 && c < 0.09) return l > 0.86 ? "cream" : l > 0.66 ? "beige" : "brown";
  if (h >= 230 && h < 290 && l < 0.4) return "navy";
  if (h < 20 || h >= 345) return l < 0.45 ? "burgundy" : l > 0.75 ? "pink" : "red";
  if (h < 50) return l < 0.5 ? "brown" : l > 0.78 ? "pink" : "orange";
  if (h < 100) return l < 0.55 ? "brown" : "orange";
  if (h < 115) return l < 0.6 ? "olive" : "yellow";
  if (h < 160) return c < 0.1 || l < 0.55 ? "olive" : "green";
  if (h < 200) return "green";
  if (h < 290) return "blue";
  if (h < 345) return l > 0.75 ? "pink" : "purple";
  return "red";
}

// Resize a photo in the browser before upload: a 1600px image for the detail
// view and a 600px one for the grid, plus the garment colour from the centre.
async function processPhoto(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
  let src = bmp;
  if (!src) {
    src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("unreadable")); i.src = URL.createObjectURL(file); });
  }
  const w = src.width, h = src.height;
  const draw = (max) => {
    const s = Math.min(1, max / Math.max(w, h));
    const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c;
  };
  const toBlob = (c, q) => new Promise((res) => c.toBlob((b) => res(b), "image/webp", q));
  const big = draw(1600), small = draw(600);
  let full = await toBlob(big, 0.86), thumb = await toBlob(small, 0.8);
  if (!full || full.type !== "image/webp") { // Safari without WebP encode
    full = await new Promise((r) => big.toBlob(r, "image/jpeg", 0.88));
    thumb = await new Promise((r) => small.toBlob(r, "image/jpeg", 0.82));
  }
  // Median colour of the centre: the garment, not the backdrop.
  const c = document.createElement("canvas"); c.width = 60; c.height = 60;
  const x = c.getContext("2d"); x.drawImage(src, 0, 0, 60, 60);
  const d = x.getImageData(18, 15, 24, 30).data, R = [], G = [], B = [];
  for (let i = 0; i < d.length; i += 4) { R.push(d[i]); G.push(d[i + 1]); B.push(d[i + 2]); }
  const med = (a) => a.sort((p, q) => p - q)[a.length >> 1];
  const color = "#" + [med(R), med(G), med(B)].map((v) => v.toString(16).padStart(2, "0")).join("");
  return { full, thumb, w, h, color };
}

function filtered() {
  const pool = live().filter((g) => (g.status || "owned") === S.status);
  const words = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  const has = (k, v) => { const s = S.sel[k]; if (!s.length) return true; return Array.isArray(v) ? v.some((x) => s.includes(x)) : v != null && s.includes(v); };
  let list = pool.filter((g) => {
    if (S.favOnly && !g.fav) return false;
    if (!has("category", g.category) || !has("brand", g.brand || null) || !has("color", g.colorFamily || null)) return false;
    if (!has("season", g.seasons || []) || !has("size", g.size || null) || !has("tag", g.tags || [])) return false;
    if (!words.length) return true;
    const hay = [g.name, g.brand, catLabel(g.category), g.colorFamily, g.material, g.collection, g.notes, ...(g.tags || []), ...(g.styles || [])].filter(Boolean).join(" ").toLowerCase();
    return words.every((w) => hay.includes(w));
  });
  const by = (f) => (a, b) => f(a).localeCompare(f(b));
  const catIx = (g) => CATEGORIES.findIndex((c) => c[0] === g.category);
  list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  if (S.sort === "oldest") list.reverse();
  if (S.sort === "name") list.sort(by((g) => (g.name || "").toLowerCase()));
  if (S.sort === "brand") list.sort(by((g) => (g.brand || "~").toLowerCase()));
  if (S.sort === "category") list.sort((a, b) => catIx(a) - catIx(b));
  return { pool, list };
}

function bindFields(root, d, onChange) {
  root.querySelectorAll("[data-one]").forEach((b) => b.onclick = () => {
    const k = b.dataset.one, v = b.dataset.v;
    d[k] = String(d[k]) === v && !["category", "status"].includes(k) ? "" : v;
    root.querySelectorAll(`[data-one="${k}"]`).forEach((x) => x.setAttribute("aria-pressed", String(d[k]) === x.dataset.v));
    onChange();
  });
  root.querySelectorAll("[data-many]").forEach((b) => b.onclick = () => {
    const k = b.dataset.many, v = b.dataset.v, a = Array.isArray(d[k]) ? d[k] : [];
    d[k] = a.includes(v) ? a.filter((x) => x !== v) : [...a, v];
    b.setAttribute("aria-pressed", d[k].includes(v));
  });
  root.querySelectorAll("[data-f]").forEach((i) => i.oninput = () => {
    if (i.dataset.f === "tagsText") d.tags = i.value.split(",").map((t) => t.trim().toLowerCase()).filter(Boolean);
    else d[i.dataset.f] = i.value;
    onChange();
  });
  const c = root.querySelector("#f-color");
  if (c) c.oninput = () => { d.color = c.value; const sp = c.nextElementSibling; sp.innerHTML = `<span class="cap1">${esc(family(c.value) || "")}</span>`; };
}
function cleanRecord(d) {
  const out = {};
  for (const k of ["name", "brand", "category", "size", "color", "status", "fit", "silhouette", "layer", "pattern", "material", "collection", "bought", "notes"]) {
    const v = typeof d[k] === "string" ? d[k].trim() : d[k]; out[k] = v === "" || v == null ? null : v;
  }
  out.formality = d.formality ? Number(d.formality) : null;
  out.price = d.price && !isNaN(parseFloat(d.price)) ? parseFloat(d.price) : null;
  for (const k of ["seasons", "styles", "tags"]) out[k] = Array.isArray(d[k]) ? d[k] : [];
  out.colorFamily = family(out.color);
  out.status = out.status || "owned";
  return out;
}

async function saveBatch() {
  const B = S.batch;
  if (!B || B.busy) return;
  const todo = B.rows.filter((r) => !r.saved);
  if (!todo.length || !todo.every((r) => r.category || B.category)) return;
  B.busy = true; B.err = ""; B.done = 0; B.total = todo.length; viewBatch();
  // Number unnamed pieces after what is already in the wardrobe: "Shoes 3", "Shoes 4".
  const count = {};
  for (const g of S.items) if (!g.deleted) count[g.category] = (count[g.category] || 0) + 1;
  let lastErr = "";
  for (const r of todo) {
    const cat = r.category || B.category;
    try {
      const images = await uploadPhotos([r.file], "front");
      const name = r.name.trim() || `${catLabel(cat)} ${(count[cat] || 0) + 1}`;
      const rec = cleanRecord({ name, category: cat, brand: B.brand, status: "owned" });
      if (images[0]) { rec.color = images[0].color; rec.colorFamily = family(rec.color); }
      const now = Date.now();
      await S.db.collection("garments").doc(newId()).set({ ...rec, images, fav: false, deleted: false, createdAt: now, updatedAt: now });
      count[cat] = (count[cat] || 0) + 1;
      r.saved = true; B.done++;
    } catch (e) {
      // Keep going; a photo that failed stays in the list to retry.
      lastErr = uploadError(e);
    }
    if (route().v === "batch") viewBatch();
  }
  B.busy = false;
  const failed = B.rows.filter((r) => !r.saved).length;
  if (!failed) { toast(`Added ${B.done} ${B.done === 1 ? "piece" : "pieces"}`); clearBatch(); location.hash = "wardrobe"; return; }
  B.err = `${failed} ${failed === 1 ? "photo was" : "photos were"} not saved. ${lastErr}`;
  if (route().v === "batch") viewBatch();
}

async function uploadPhotos(files, kindFirst) {
  const out = [];
  for (const [i, f] of files.entries()) {
    const p = await processPhoto(f);
    const a = await S.assets.upload(p.full);
    const t = await S.assets.upload(p.thumb);
    out.push({ id: a.id, thumb: t.id, w: p.w, h: p.h, kind: i === 0 ? kindFirst : "detail", color: p.color, source: "own" });
  }
  return out;
}
function uploadError(e) {
  const c = e && e.code;
  if (c === "too_large") return "That photo is too large. Try a smaller one.";
  if (c === "unsupported_type") return "That file type is not supported. Use a JPEG, PNG or WebP photo.";
  if (c === "quota_or_state") return "Photo storage is full.";
  if (c === "rate_limited") return "Too many uploads at once. Wait a moment and save again.";
  if (e && e.message === "unreadable") return "That photo could not be read. iPhone HEIC photos: choose 'Most compatible' in camera settings, or send a JPEG.";
  return "Saving failed. Check your connection and try again.";
}
async function saveNew(again) {
  const d = S.draft;
  if (S.busy || !(d.name || "").trim() || !d.category) return;
  S.busy = true; S.err = ""; viewAdd();
  try {
    const images = S.files.length && S.assets ? await uploadPhotos(S.files.map((f) => f.file), "front") : [];
    const rec = cleanRecord(d);
    if (!rec.color && images[0]) { rec.color = images[0].color; rec.colorFamily = family(rec.color); }
    const id = newId(), now = Date.now();
    await S.db.collection("garments").doc(id).set({ ...rec, images, fav: false, deleted: false, createdAt: now, updatedAt: now });
    S.busy = false;
    if (again) { newDraft({ category: d.category, brand: d.brand, status: d.status }); toast("Saved"); viewAdd(); window.scrollTo(0, 0); }
    else { S.draft = null; location.hash = "item-" + id; }
  } catch (e) {
    S.busy = false; S.err = uploadError(e); viewAdd();
  }
}

// ---------- Storage on this device (IndexedDB) ----------
// Same shape as the cloud store the app was written against, so moving to
// an online database later swaps this block only.
const Local = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("rail", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("garments"); r.result.createObjectStore("blobs"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  const entries = async (store) => {
    const d = await open();
    return new Promise((res, rej) => {
      const out = [], t = d.transaction(store, "readonly"), c = t.objectStore(store).openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
    });
  };
  const items = new Map(), subs = new Set();
  const emit = () => setTimeout(() => {
    const docs = [...items].map(([id, v]) => ({ id, exists: true, data: () => v, metadata: { fromCache: false } }));
    subs.forEach((fn) => fn({ docs, metadata: { fromCache: false, hasPendingWrites: false } }));
  });
  const clone = (v) => JSON.parse(JSON.stringify(v));
  let asked = false;
  // Ask the browser not to clear RAIL's storage when the device runs low.
  const persist = () => { if (asked) return; asked = true; try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} };
  const ref = (id) => ({
    id,
    async get() { return { id, exists: items.has(id), data: () => items.get(id) }; },
    async set(v) { const c = clone(v); await run("garments", "readwrite", (s) => s.put(c, id)); items.set(id, c); persist(); emit(); },
    async update(p) {
      if (!items.has(id)) throw { code: "invalid_argument" };
      const c = { ...items.get(id), ...clone(p) };
      await run("garments", "readwrite", (s) => s.put(c, id)); items.set(id, c); emit();
    },
  });
  const db = {
    collection: () => ({ doc: (id) => ref(id), onSnapshot(fn) { subs.add(fn); emit(); return () => subs.delete(fn); } }),
    doc: () => ({ async get() { return { exists: false, data: () => undefined }; }, onSnapshot() { return () => {}; } }),
  };
  const assets = {
    async upload(blob) {
      const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
      await run("blobs", "readwrite", (s) => s.put(blob, id));
      URLS.set(id, URL.createObjectURL(blob));
      return { id, url: URLS.get(id) };
    },
  };
  return {
    db, assets, entries,
    async load() {
      for (const [id, v] of await entries("garments")) items.set(id, v);
      for (const [id, b] of await entries("blobs")) URLS.set(id, URL.createObjectURL(b));
    },
    async replaceAll(records, blobs) {
      for (const [id, b] of blobs) { await run("blobs", "readwrite", (s) => s.put(b, id)); URLS.set(id, URL.createObjectURL(b)); }
      for (const [id, v] of records) { await run("garments", "readwrite", (s) => s.put(v, id)); items.set(id, v); }
      persist(); emit();
    },
  };
})();

// ---------- Backup and restore ----------
const toDataUrl = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function backup() {
  const b = $("#backup"); b.disabled = true; b.textContent = "Preparing backup";
  try {
    const garments = Object.fromEntries(await Local.entries("garments"));
    const used = new Set(Object.values(garments).flatMap((g) => (g.images || []).flatMap((i) => [i.id, i.thumb, i.studio && i.studio.id, i.studio && i.studio.thumb].filter(Boolean))));
    const photos = {};
    for (const [id, blob] of await Local.entries("blobs")) if (used.has(id)) photos[id] = await toDataUrl(blob);
    const name = "rail-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    const file = new File([JSON.stringify({ app: "RAIL", version: 1, savedAt: new Date().toISOString(), garments, photos })], name, { type: "application/json" });
    // Phones: the share sheet (Save to Files, Drive, AirDrop). Computers: a download.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "RAIL backup" }); toast("Backup ready"); }
      catch (e) { if (e && e.name !== "AbortError") throw e; }
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("Backup saved");
    }
  } catch { toast("Backup failed. Try again."); }
  b.disabled = false; b.textContent = "Back up wardrobe";
}
async function restore(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "RAIL" || !data.garments) throw new Error("not a backup");
    const blobs = [];
    for (const [id, url] of Object.entries(data.photos || {})) blobs.push([id, await (await fetch(url)).blob()]);
    await Local.replaceAll(Object.entries(data.garments), blobs);
    toast(`Restored ${Object.keys(data.garments).length} pieces`);
    location.hash = "wardrobe";
  } catch { toast("That file is not a RAIL backup."); }
}

// ---------- Studio photos ----------
// Cuts the garment out on this device with U-2-Netp (a small open model, 4.6 MB,
// Apache 2.0, served from models/ and kept in the browser cache), then centres it
// on a transparent 4:5 canvas with a soft shadow. The grey well behind every
// photo shows through, so studio shots line up like a shop's product pages.
// Nothing leaves the phone, and the original photo is always kept.
const Studio = (() => {
  const ORT = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/";
  const MODEL = "models/u2netp.onnx", CACHE = "studio-model-u2netp-1";
  const N = 320, OUT_W = 1200, OUT_H = 1500;
  let sessP = null;
  async function modelBytes(onProgress) {
    let cache = null;
    try { cache = await caches.open(CACHE); } catch {}
    const hit = cache && (await cache.match(MODEL));
    if (hit) return hit.arrayBuffer();
    const r = await fetch(MODEL);
    if (!r.ok || !r.body) throw new Error("model");
    const total = +r.headers.get("content-length") || 4.6e6, reader = r.body.getReader(), parts = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      if (onProgress) onProgress(Math.min(1, got / total));
    }
    const blob = new Blob(parts);
    if (cache) await cache.put(MODEL, new Response(blob)).catch(() => {});
    return blob.arrayBuffer();
  }
  function session(onProgress) {
    return sessP || (sessP = (async () => {
      const ort = await import(ORT + "ort.wasm.min.mjs");
      ort.env.wasm.wasmPaths = ORT;
      const s = await ort.InferenceSession.create(await modelBytes(onProgress), { executionProviders: ["wasm"] });
      return { ort, s };
    })().catch((e) => { sessP = null; throw e; }));
  }
  const canvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  const encode = async (c) => {
    const b = await new Promise((r) => c.toBlob(r, "image/webp", 0.88));
    return b && b.type === "image/webp" ? b : new Promise((r) => c.toBlob(r, "image/png")); // PNG keeps transparency on Safari
  };
  async function source(blob) {
    const bmp = await createImageBitmap(blob, { imageOrientation: "from-image" }).catch(() => null);
    if (bmp) return bmp;
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("unreadable")); i.src = URL.createObjectURL(blob); });
  }
  // onStep("download", 0..1) while the model loads the first time, then onStep("work").
  async function make(blob, onStep = () => {}) {
    const { ort, s } = await session((p) => onStep("download", p));
    onStep("work");
    await new Promise((r) => setTimeout(r, 30)); // let the label paint before the busy part
    const src = await source(blob);
    // 1. Mask at the model's 320 x 320
    const m = canvas(N, N), mx = m.getContext("2d", { willReadFrequently: true });
    mx.drawImage(src, 0, 0, N, N);
    const px = mx.getImageData(0, 0, N, N).data, input = new Float32Array(3 * N * N), P = N * N;
    for (let i = 0, j = 0; i < px.length; i += 4, j++) {
      input[j] = (px[i] / 255 - 0.485) / 0.229; input[j + P] = (px[i + 1] / 255 - 0.456) / 0.224; input[j + 2 * P] = (px[i + 2] / 255 - 0.406) / 0.225;
    }
    const out = await s.run({ [s.inputNames[0]]: new ort.Tensor("float32", input, [1, 3, N, N]) });
    const v = out[s.outputNames[0]].data;
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < v.length; i++) { if (v[i] < lo) lo = v[i]; if (v[i] > hi) hi = v[i]; }
    const md = mx.createImageData(N, N), range = hi - lo || 1;
    for (let i = 0; i < v.length; i++) {
      // Firm up the edge: values near 0 or 1 snap to clear or solid.
      md.data[i * 4 + 3] = Math.round(255 * Math.max(0, Math.min(1, ((v[i] - lo) / range - 0.1) / 0.8)));
    }
    mx.putImageData(md, 0, 0);
    // 2. Apply the mask to the photo (at most 1600 px on the long side)
    const sc = Math.min(1, 1600 / Math.max(src.width, src.height));
    const W = Math.round(src.width * sc), H = Math.round(src.height * sc);
    const p = canvas(W, H), pc = p.getContext("2d", { willReadFrequently: true });
    pc.imageSmoothingQuality = "high";
    pc.drawImage(m, 0, 0, W, H);
    pc.globalCompositeOperation = "source-in";
    pc.drawImage(src, 0, 0, W, H);
    pc.globalCompositeOperation = "source-over";
    // 3. Bounding box of the garment
    const a = pc.getImageData(0, 0, W, H).data;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (a[(y * W + x) * 4 + 3] > 96) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0 || (x1 - x0) * (y1 - y0) < W * H * 0.01) throw new Error("nothing found");
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    // 4. Centre on the 4:5 canvas with a soft shadow
    const k = Math.min((OUT_W * 0.82) / bw, (OUT_H * 0.84) / bh);
    const dw = Math.round(bw * k), dh = Math.round(bh * k), dx = Math.round((OUT_W - dw) / 2), dy = Math.round((OUT_H - dh) / 2);
    const o = canvas(OUT_W, OUT_H), ox = o.getContext("2d");
    ox.imageSmoothingQuality = "high";
    ox.shadowColor = "rgba(0,0,0,0.20)"; ox.shadowBlur = 36; ox.shadowOffsetY = 16;
    ox.drawImage(p, x0, y0, bw, bh, dx, dy, dw, dh);
    const t = canvas(480, 600), tx = t.getContext("2d");
    tx.imageSmoothingQuality = "high";
    tx.drawImage(o, 0, 0, 480, 600);
    return { full: await encode(o), thumb: await encode(t), w: OUT_W, h: OUT_H };
  }
  return { make };
})();

    S.db.collection("garments").onSnapshot((snap) => {
      S.items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      S.loaded = true;
      const r = route();
      if (S.edit || r.v === "add") return;
      if (S.filterOpen) { renderLayer(); renderGrid(); updateCount(); return; }
      render();
    });
  } catch (e) {
    S.failed = "nodb"; render();
  }
  registerUpdater();
})();
</script>
</body>
</html>
