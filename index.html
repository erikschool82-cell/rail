<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAIL</title>
<meta name="description" content="A personal wardrobe archive.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RAIL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&display=swap">
<style>
/* Layout: archive panels edge to edge, 1px hairlines, square corners, photos on a neutral well. Mobile first. */
:root {
  --paper: #ffffff;
  --ink: #000000;
  --mute: #737373;
  --line: #dcdcdc;
  --well: #efefef;
  --alert: #c8102e;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --bar: 56px;
  --top: 52px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0b0b0b; --ink: #f2f2f2; --mute: #8f8f8f; --line: #2a2a2a; --well: #171717; --alert: #ff5a6e; color-scheme: dark } }
:root[data-theme="dark"] { --paper: #0b0b0b; --ink: #f2f2f2; --mute: #8f8f8f; --line: #2a2a2a; --well: #171717; --alert: #ff5a6e; color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { margin: 0; font: 400 13px/18px var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; margin: 0; }
button { cursor: pointer; padding: 0; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
::selection { background: var(--ink); color: var(--paper); }
.label { font-size: 11px; line-height: 14px; letter-spacing: .07em; text-transform: uppercase; font-weight: 500; }
.mute { color: var(--mute); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; }
#top { display: contents; }
.top-row { grid-column: 1; display: flex; align-items: stretch; height: var(--top); min-width: 0; }
.search { grid-column: 1 / -1; }
.undo { grid-column: 2; grid-row: 1; height: var(--top); width: calc(52px + env(safe-area-inset-right, 0px)); padding-right: env(safe-area-inset-right, 0px);
  display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--line); }
.undo:disabled { color: var(--line); cursor: default; }
.ico { display: flex; align-items: center; justify-content: center; }
.top-row > * { display: flex; align-items: center; }
.word { font-weight: 500; font-size: 15px; letter-spacing: .2em; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; border-right: 1px solid var(--line); }
.count { padding: 0 12px; gap: 6px; }
.tbtn { padding: 0 14px; border-left: 1px solid var(--line); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.grow { flex: 1; min-width: 0; }
.search { border-top: 1px solid var(--line); display: flex; height: 44px; }
.search input { flex: 1; min-width: 0; padding: 0 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); font-size: 16px; }
.search input::placeholder { color: var(--mute); }
.title { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px; }
.back { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; border-right: 1px solid var(--line); color: var(--mute); }

/* Bottom bar */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--paper); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); height: calc(var(--bar) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--mute); text-decoration: none;
  font-size: 10px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; }
.nav a::before { content: ""; width: 4px; height: 4px; background: transparent; }
.nav a[aria-current="page"] { color: var(--ink); }
.nav a[aria-current="page"]::before { background: var(--ink); }
.fab { position: fixed; z-index: 31; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 16px);
  height: 44px; padding: 0 18px; background: var(--ink); color: var(--paper); display: flex; align-items: center; text-decoration: none; }
main { padding-bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 76px); min-height: 100vh; }

/* Grids */
.masonry { display: flex; gap: 8px; padding: 8px max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px)); }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.archive { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.archive .card { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.archive .card:nth-child(3n) { border-right: 0; }
.card { display: block; color: inherit; text-decoration: none; min-width: 0; }
.card:active .well img { opacity: .8; }
.well { position: relative; width: 100%; max-width: 100%; background: var(--well); overflow: hidden; }
.well img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .16s ease-out; }
.well img.on { opacity: 1; }
.well .none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.cap { padding: 7px 4px 10px; min-width: 0; }
.archive .cap { padding: 6px 8px 9px; }
.cap .b, .cap .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cap .b { font-size: 10px; line-height: 13px; letter-spacing: .07em; text-transform: uppercase; font-weight: 500; }
.cap .b + .n { color: var(--mute); }
.fav-dot { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; background: var(--ink); }

/* Panels and empty states */
.empty { padding: 48px 16px; display: flex; justify-content: center; }
.box { border: 1px solid var(--line); width: 100%; max-width: 380px; }
.box > * { padding: 14px 16px; }
.box > * + * { border-top: 1px solid var(--line); }
.box p { margin: 0; color: var(--mute); }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 16px; border: 1px solid var(--ink);
  font-size: 11px; letter-spacing: .07em; text-transform: uppercase; font-weight: 500; color: var(--ink); text-decoration: none; }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.full { width: 100%; }
.btn:disabled { opacity: .35; pointer-events: none; }
.btn.danger { border-color: var(--alert); background: var(--alert); color: #fff; }

/* Sheet (filters) */
.scrim { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--ink) 35%, transparent); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--paper); border-top: 1px solid var(--ink);
  max-height: 82vh; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; height: 48px; border-bottom: 1px solid var(--line); }
.sheet-body { overflow-y: auto; }
.group { padding: 14px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.group > .label { margin-bottom: 10px; display: block; color: var(--mute); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 32px; padding: 0 11px; border: 1px solid var(--line); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
a.chip { color: inherit; text-decoration: none; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .sw { width: 10px; height: 10px; border: 1px solid var(--line); }
.chip .n { color: var(--mute); font-size: 11px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.cap1::first-letter { text-transform: uppercase; }

/* Forms */
.row { padding: 12px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.row > .label { display: block; color: var(--mute); margin-bottom: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.two .row { border-bottom: 0; }
.two .row + .row { border-left: 1px solid var(--line); padding-left: 16px; }
.field { width: 100%; font-size: 16px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.field:focus { outline: none; border-bottom-color: var(--ink); }
textarea.field { min-height: 72px; resize: vertical; }
.colour { display: flex; align-items: center; gap: 12px; }
.colour input[type=color] { width: 48px; height: 32px; padding: 0; border: 1px solid var(--line); }
.actions { position: sticky; bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr 1fr; background: var(--line); gap: 1px; border-top: 1px solid var(--line); z-index: 5; }
.actions button { height: 52px; background: var(--paper); }
.actions button.solid { background: var(--ink); color: var(--paper); }
.actions button:disabled { opacity: .4; }
.batch-link { display: block; width: 100%; text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); text-decoration: none; }
.brow { display: grid; grid-template-columns: 72px minmax(0, 1fr) 32px; gap: 12px; align-items: start; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.brow .shot { aspect-ratio: 4 / 5; }
.brow .x { width: 32px; height: 32px; font-size: 16px; }
.brow select.field { margin-top: 6px; font-size: 14px; }
.brow.saved { opacity: .35; }
.err { color: var(--alert); padding: 12px 16px; border-bottom: 1px solid var(--line); }
.more { padding: 14px 16px; display: block; text-decoration: underline; text-underline-offset: 4px; }

/* Photo picker */
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.shot { position: relative; background: var(--well); aspect-ratio: 4 / 5; max-width: 100%; }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.shot .tag { position: absolute; left: 6px; top: 6px; background: var(--paper); padding: 2px 5px; }
.shot .x { position: absolute; right: 0; top: 0; width: 32px; height: 32px; background: var(--paper); font-size: 16px; }
.shot.add { display: flex; align-items: center; justify-content: center; background: var(--paper); color: var(--mute); }
.pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; aspect-ratio: 4 / 3; max-width: 100%; width: 100%; background: var(--well); border-bottom: 1px solid var(--line); }

/* Detail */
.carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; background: var(--well); }
.carousel::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: start; }
.stage { position: relative; }
.ph-menu { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; background: var(--paper); color: var(--ink); }
.strip { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.strip::-webkit-scrollbar { display: none; }
.strip > button { flex: 0 0 auto; position: relative; width: 44px; aspect-ratio: 4 / 5; background: var(--well); }
.strip > button img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.strip > button[aria-current="true"] { outline: 1px solid var(--ink); outline-offset: 2px; }
.strip .add-t { background: none; border: 1px solid var(--line); color: var(--mute); }
.recover { display: block; width: 100%; text-align: left; padding: 0 16px 12px; margin-top: -4px; color: var(--mute); border-bottom: 1px solid var(--line); }
.recover u { color: var(--ink); text-underline-offset: 3px; }
.strip:has(+ #recover-slot .recover) { border-bottom: 0; }
.head { padding: 20px 16px 18px; }
.head h1 { margin: 4px 0 0; font-size: 22px; line-height: 28px; font-weight: 400; text-wrap: balance; }
.meta { margin-top: 6px; color: var(--mute); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 20px; border-bottom: 1px solid var(--line); }
.btn.plain { text-transform: none; letter-spacing: 0; font-size: 14px; gap: 8px; }
.sq { width: 8px; height: 8px; border: 1px solid currentColor; }
.sq.on { background: currentColor; }
.part { padding: 18px 16px 20px; border-bottom: 1px solid var(--line); }
.part h2 { margin: 0 0 14px; font-size: 13px; line-height: 18px; font-weight: 500; }
.specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; margin: 0; }
.specs dt { color: var(--mute); font-size: 12px; line-height: 16px; }
.specs dd { margin: 2px 0 0; font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
.part .chips { margin-top: 2px; }
.part .chip { height: 28px; font-size: 13px; }
.linkish { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-align: left; }
.part .linkish { margin-top: 16px; display: block; }
.notes { white-space: pre-wrap; margin: 0; font-size: 14px; line-height: 21px; }
.foot { display: flex; gap: 24px; padding: 18px 16px; }
.foot button { color: var(--mute); text-decoration: underline; text-underline-offset: 4px; }
.foot .danger { color: var(--alert); }
.confirm { background: var(--well); padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.confirm .btns { display: flex; gap: 8px; }
.swatch { display: inline-block; width: 11px; height: 11px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 6px; }
.opt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
.opt .mute { font-size: 12px; line-height: 16px; }
.opt.danger { color: var(--alert); }
.opt:disabled { opacity: .5; }
.toast { display: flex; align-items: center; gap: 16px; }
.toast button { color: inherit; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }

/* Profile */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.stats div { background: var(--paper); padding: 18px 16px; }
.stats .v { font-size: 24px; line-height: 28px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.bars li { display: grid; grid-template-columns: 112px 1fr 28px; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.bars { list-style: none; margin: 0; padding: 0; }
.bars .t { height: 3px; background: var(--line); }
.bars .t i { display: block; height: 100%; background: var(--ink); }
.bars .c { text-align: right; font-variant-numeric: tabular-nums; color: var(--mute); }
.status-note { padding: 10px 16px; border-bottom: 1px solid var(--line); }
.update { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top)); z-index: 19; display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--paper); min-height: 44px; padding-block: 6px; }
.update span { flex: 1; min-width: 0; }
.update button { height: 32px; padding: 0 12px; border: 1px solid var(--paper); }
.version { display: flex; align-items: center; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); margin-top: 24px; }
.version span { flex: 1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 72px); z-index: 60;
  background: var(--ink); color: var(--paper); padding: 10px 14px; max-width: calc(100% - 32px); }

/* Outfits: one grey well, the pieces laid out head to toe */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.modes button { height: 44px; background: var(--paper); color: var(--mute); padding: 0 4px; font-size: 10px; letter-spacing: .05em; white-space: nowrap; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.fit-ctx { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; text-align: left; border-bottom: 1px solid var(--line); }
.fit-ctx .label { text-decoration: underline; text-underline-offset: 4px; }
.fl { background: var(--well); padding: 16px 12px 20px; display: flex; flex-direction: column; align-items: center; border-bottom: 1px solid var(--line); }
.tier { display: flex; justify-content: center; align-items: flex-end; gap: 2%; width: 100%; }
.tier-2, .tier-3 { margin-top: -5%; }
.pc { position: relative; aspect-ratio: 4 / 5; }
.pc-img { position: absolute; inset: 0; width: 100%; height: 100%; }
.pc-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pc-img:active img { opacity: .8; }
.pc-tools { position: absolute; top: 0; right: 0; display: flex; flex-direction: column; gap: 1px; }
.pc-b { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--paper); color: var(--ink); }
.pc-b[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.pc-tag { position: absolute; left: 0; bottom: 8%; background: var(--paper); padding: 2px 5px; }
.pc-gap { display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; border: 1px solid var(--line); background: var(--paper); font-size: 12px; line-height: 16px; margin-top: 5%; }
.fl-none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.fit-adds { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 12px; }
.why { margin: 12px 0 16px; font-size: 14px; line-height: 20px; min-height: 20px; }
.err-t, .alert-t { color: var(--alert); }
.fit-head { padding-block: 14px; border-bottom: 1px solid var(--line); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) 48px; border-bottom: 1px solid var(--line); }
.srow-main { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 12px 0 12px max(16px, env(safe-area-inset-left, 0px)); min-width: 0; }
.sthumbs { display: flex; gap: 4px; margin-bottom: 2px; }
.st { position: relative; width: 40px; aspect-ratio: 4 / 5; background: var(--well); overflow: hidden; }
.st img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.st.dead { outline: 1px solid var(--alert); outline-offset: -1px; }
.st.dead img { opacity: .3; }
.stext { font-size: 14px; line-height: 20px; }
.stext-2 { font-size: 12px; line-height: 16px; }
.srow .x { width: 48px; height: 48px; font-size: 18px; color: var(--mute); align-self: center; }
.tiles-head { padding-block: 14px 10px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; padding: 0 16px 14px; }
.tile { display: flex; flex-direction: column; gap: 5px; text-align: left; min-width: 0; }
.tile .shot { width: 100%; }
.tile-n { font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
a.opt { color: inherit; text-decoration: none; }

/* Wider screens: rail on the left, more columns */
@media (min-width: 900px) {
  .nav { top: 0; bottom: 0; right: auto; width: 176px; height: auto; grid-template-columns: 1fr; grid-auto-rows: 40px; align-content: start;
    padding-top: calc(env(safe-area-inset-top, 0px) + 60px); border-top: 0; border-right: 1px solid var(--line); }
  .nav a { flex-direction: row; justify-content: flex-start; padding-left: 18px; font-size: 11px; gap: 8px; }
  .nav a::before { width: 5px; height: 5px; }
  body { padding-left: 176px; }
  .fab { right: auto; left: 16px; bottom: 16px; width: 144px; justify-content: center; }
  main { padding-bottom: 40px; }
  .archive { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .archive .card:nth-child(3n) { border-right: 1px solid var(--line); }
  .masonry, .col { gap: 16px; }
  .masonry { padding: 16px; }
  .detail { display: grid; grid-template-columns: minmax(0, 7fr) minmax(340px, 4fr); }
  .detail > section:first-child { border-right: 1px solid var(--line); }
  .actions { bottom: 0; }
  .sheet { left: auto; width: 420px; top: 0; max-height: none; border-top: 0; border-left: 1px solid var(--ink); }
  .toast { bottom: 32px; }
  .form-wrap { max-width: 640px; border-right: 1px solid var(--line); }
  .fit-wrap { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); align-items: start; }
  .fit-gen { border-right: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { .well img { transition: none; } }
html { padding-top: env(safe-area-inset-top, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
.install { padding-block: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }

<body>

<nav class="nav" id="nav" aria-label="Sections">

<script>
// ---------- Vocabulary (the outfit engine will read these words) ----------
const CATEGORIES = [
  ["outerwear", "Outerwear"], ["tops", "Tops"], ["shirts", "Shirts"], ["knitwear", "Knitwear"],
  ["trousers", "Trousers"], ["bottoms", "Shorts and skirts"], ["one-piece", "One-piece"],
  ["shoes", "Shoes"], ["accessories", "Accessories"],
];
const catLabel = (id) => (CATEGORIES.find((c) => c[0] === id) || [id, id])[1];
const FITS = ["oversized", "relaxed", "regular", "slim", "skinny"];
const SILHOUETTES = ["wide", "straight", "tapered", "skinny", "tailored", "boxy", "cropped", "longline"];
const STYLES = ["minimalist", "avant-garde", "classic", "streetwear", "contemporary", "workwear", "casual", "tailored"];
const SEASONS = ["spring", "summer", "autumn", "winter"];
const LAYERS = ["base", "mid", "outer", "statement"];
const PATTERNS = ["solid", "stripe", "check", "print", "graphic", "texture"];
const FORMALITY = ["", "Very casual", "Casual", "Smart casual", "Smart", "Formal"];
const STATUSES = [["owned", "Owned"], ["wishlist", "Wishlist"], ["archived", "Archived"]];
const KINDS = ["front", "back", "detail", "label", "worn"];
const FAMILY_HEX = { black: "#111", charcoal: "#3a3a3a", grey: "#9a9a9a", white: "#fff", cream: "#efe7d6", beige: "#cdb999",
  brown: "#6b4a32", navy: "#1d2a44", blue: "#3a5fa0", green: "#3d6b4a", olive: "#6b6b3a", red: "#b3242a",
  burgundy: "#5e1a24", pink: "#e3a6b4", purple: "#6a4a8a", yellow: "#e3c440", orange: "#d97a2a" };

// Demo pieces for trying RAIL out. Photos in demo/ (Unsplash License, see demo/CREDITS.txt).
// Every demo piece carries the tag "demo" so Profile can remove them all at once.
const DEMO = [
  { name: "Leather biker jacket", brand: "Schott", category: "outerwear", size: "M", color: "#141414", material: "Cowhide leather", fit: "regular", silhouette: "cropped", layer: "outer", pattern: "solid", formality: 2, price: 690, seasons: ["spring", "autumn"], styles: ["classic", "streetwear"] },
  { name: "Denim trucker jacket", brand: "Lee", category: "outerwear", size: "M", color: "#2a3f63", material: "Denim, corduroy collar", fit: "regular", silhouette: "boxy", layer: "outer", pattern: "solid", formality: 2, price: 120, seasons: ["spring", "autumn"], styles: ["workwear", "casual"] },
  { name: "Navy wool blazer", brand: "Lardini", category: "outerwear", size: "50", color: "#1d2a44", material: "Wool", fit: "slim", silhouette: "tailored", layer: "outer", pattern: "solid", formality: 4, price: 850, seasons: ["autumn", "winter", "spring"], styles: ["tailored", "classic"] },
  { name: "Military overshirt", brand: "Vintage", category: "shirts", size: "L", color: "#4c5a3a", material: "Cotton twill", fit: "relaxed", silhouette: "boxy", layer: "mid", pattern: "solid", formality: 2, price: 60, seasons: ["spring", "autumn"], styles: ["workwear", "casual"] },
  { name: "White oxford shirt", brand: "Comme des Garçons Shirt", category: "shirts", size: "M", color: "#f4f4f2", material: "Cotton oxford", fit: "regular", silhouette: "straight", layer: "base", pattern: "solid", formality: 3, price: 210, seasons: ["spring", "summer", "autumn"], styles: ["minimalist", "classic"] },
  { name: "Heavyweight white tee", brand: "Lady White Co.", category: "tops", size: "M", color: "#f7f7f5", material: "Cotton jersey", fit: "regular", silhouette: "boxy", layer: "base", pattern: "solid", formality: 1, price: 75, seasons: ["spring", "summer"], styles: ["minimalist", "casual"] },
  { name: "Heather grey tee", brand: "Sunspel", category: "tops", size: "M", color: "#9aa3ad", material: "Cotton", fit: "slim", silhouette: "straight", layer: "base", pattern: "solid", formality: 1, price: 80, seasons: ["spring", "summer"], styles: ["minimalist", "casual"] },
  { name: "White hoodie", brand: "Our Legacy", category: "tops", size: "L", color: "#f2f2f0", material: "Cotton fleece", fit: "relaxed", silhouette: "boxy", layer: "mid", pattern: "solid", formality: 1, price: 180, seasons: ["autumn", "winter", "spring"], styles: ["streetwear", "casual"] },
  { name: "Chunky knit jumper", brand: "Margaret Howell", category: "knitwear", size: "M", color: "#ece6da", material: "Wool", fit: "relaxed", silhouette: "boxy", layer: "mid", pattern: "texture", formality: 2, price: 320, seasons: ["autumn", "winter"], styles: ["minimalist", "classic"] },
  { name: "Mid wash jeans", brand: "Levi's Vintage Clothing", category: "trousers", size: "32/32", color: "#4a6a94", material: "Selvedge denim", fit: "regular", silhouette: "straight", layer: "base", pattern: "solid", formality: 1, price: 230, seasons: ["spring", "autumn", "winter"], styles: ["classic", "casual"] },
  { name: "Raw indigo jeans", brand: "A.P.C.", category: "trousers", size: "31", color: "#24324f", material: "Raw denim", fit: "slim", silhouette: "tapered", layer: "base", pattern: "solid", formality: 2, price: 210, seasons: ["autumn", "winter", "spring"], styles: ["minimalist", "classic"] },
  { name: "Side-zip ankle boots", brand: "Ann Demeulemeester", category: "shoes", size: "43", color: "#151515", material: "Calf leather", formality: 3, price: 780, seasons: ["autumn", "winter"], styles: ["avant-garde", "minimalist"] },
  { name: "Lace-up work boots", brand: "Red Wing", category: "shoes", size: "43", color: "#3b2a20", material: "Leather", formality: 2, price: 340, seasons: ["autumn", "winter"], styles: ["workwear", "classic"] },
  { name: "White leather sneakers", brand: "Puma", category: "shoes", size: "43", color: "#f5f5f5", material: "Leather", formality: 1, price: 90, seasons: ["spring", "summer", "autumn"], styles: ["minimalist", "casual"] },
  { name: "Woven leather tote", brand: "Bottega Veneta", category: "accessories", size: "One size", color: "#9a5530", material: "Intrecciato leather", formality: 3, price: 2900, seasons: ["spring", "summer", "autumn"], styles: ["classic", "contemporary"] },
  { name: "Grey leather satchel", brand: "Cambridge Satchel", category: "accessories", size: "One size", color: "#8a8a86", material: "Leather", formality: 3, price: 160, seasons: ["spring", "autumn", "winter"], styles: ["classic"] },
].map((d, i) => ({ ...d, photo: "demo/" + String(i + 1).padStart(2, "0") + ".jpg", tags: ["demo"], notes: "Demo piece. Remove all demo pieces in Profile." }));
const isDemo = (g) => (g.tags || []).includes("demo");
// Next demo not yet in the wardrobe, so repeated taps give different pieces.
function nextDemo() {
  const have = new Set(S.items.filter((g) => !g.deleted && isDemo(g)).map((g) => g.name));
  return DEMO.find((d) => !have.has(d.name)) || DEMO[Math.floor(Math.random() * DEMO.length)];
}
async function demoFile(d) {
  const r = await fetch(d.photo);
  if (!r.ok) throw new Error("demo photo");
  return new File([await r.blob()], d.photo.split("/").pop(), { type: "image/jpeg" });
}
// Fill the Add form with a demo piece; the person still taps Save, so the real flow is tested.
async function fillDemo() {
  const d = nextDemo();
  const { photo, ...fields } = d;
  newDraft(fields);
  S.more = true;
  try { const f = await demoFile(d); S.files.push({ file: f, url: URL.createObjectURL(f) }); } catch { toast("Demo photo unavailable offline"); }
  viewAdd();
}
// Profile: add every missing demo piece in one go.
async function addAllDemo(btn) {
  btn.disabled = true;
  const have = new Set(S.items.filter((g) => !g.deleted && isDemo(g)).map((g) => g.name));
  let n = 0;
  await Undo.act("Demo pieces added", async () => { for (const d of DEMO.filter((x) => !have.has(x.name))) {
    btn.textContent = `Adding ${++n}`;
    const { photo, ...fields } = d;
    let images = [];
    try { images = await uploadPhotos([await demoFile(d)], "front"); } catch {}
    images.forEach((im) => (im.source = "demo"));
    const now = Date.now();
    await S.db.collection("garments").doc(newId()).set({ ...cleanRecord(fields), images, fav: false, deleted: false, createdAt: now, updatedAt: now });
  } });
  toast(n ? `Added ${n} demo pieces` : "All demo pieces are already in");
  location.hash = "wardrobe";
}
async function removeDemo() {
  const list = S.items.filter((g) => !g.deleted && isDemo(g));
  if (!list.length) return toast("No demo pieces to remove");
  if (!confirm(`Remove ${list.length} demo piece${list.length > 1 ? "s" : ""}? Your own pieces stay.`)) return;
  const now = Date.now();
  await Undo.act("Demo pieces removed", async () => { for (const g of list) await S.db.collection("garments").doc(g.id).update({ deleted: true, updatedAt: now }); });
  toast(`Removed ${list.length} demo pieces`, true);
  viewProfile();
}

// ---------- Colour: OKLCH so distances match what the eye sees ----------
function oklch(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lin = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { const s = v / 255; return s <= 0.04045 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; });
  const [r, g, b] = lin;
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s;
  const A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;
  const B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
  let H = Math.atan2(B, A) * 180 / Math.PI; if (H < 0) H += 360;
  return { l: L, c: Math.hypot(A, B), h: H };
}
function family(hex) {
  if (!/^#[0-9a-f]{6}$/i.test(hex || "")) return null;
  const { l, c, h } = oklch(hex);
  if (c < 0.03) return l < 0.3 ? "black" : l < 0.5 ? "charcoal" : l < 0.85 ? "grey" : "white";
  if (h >= 50 && h < 100 && c < 0.09) return l > 0.86 ? "cream" : l > 0.66 ? "beige" : "brown";
  if (h >= 230 && h < 290 && l < 0.4) return "navy";
  if (h < 20 || h >= 345) return l < 0.45 ? "burgundy" : l > 0.75 ? "pink" : "red";
  if (h < 50) return l < 0.5 ? "brown" : l > 0.78 ? "pink" : "orange";
  if (h < 100) return l < 0.55 ? "brown" : "orange";
  if (h < 115) return l < 0.6 ? "olive" : "yellow";
  if (h < 160) return c < 0.1 || l < 0.55 ? "olive" : "green";
  if (h < 200) return "green";
  if (h < 290) return "blue";
  if (h < 345) return l > 0.75 ? "pink" : "purple";
  return "red";
}

// ---------- Outfit engine ----------
// Two layers. Rules say pass or fail, so nothing in an outfit clashes; a score
// then picks the best of what passed. Runs on this device from the fields
// every piece already has: category, colour, formality, season, style, fit.
const OCCASIONS = [["", "Any occasion", 0], ["casual", "Casual", 2], ["smart-casual", "Smart casual", 3], ["smart", "Smart", 4], ["formal", "Formal", 5]];
// Head to toe; "one" (one-piece) stands in for top and bottom together.
const SLOTS = [["outer", "outerwear", "outerwear"], ["mid", "layer", "layers"], ["top", "top", "tops"], ["one", "one-piece", "one-pieces"],
  ["bottom", "bottom", "bottoms"], ["shoes", "shoes", "shoes"], ["acc", "accessory", "accessories"]];
const slotNoun = (s, many) => (SLOTS.find((x) => x[0] === s) || [s, s, s])[many ? 2 : 1];
const thisSeason = () => SEASONS[[3, 3, 0, 0, 0, 1, 1, 1, 2, 2, 2, 3][new Date().getMonth()]];
const Outfit = (() => {
  const NEUTRAL = new Set(["black", "charcoal", "grey", "white", "cream", "beige", "brown", "navy", "olive"]);
  const LOUD = new Set(["stripe", "check", "print", "graphic"]);
  const TOPS = ["tops", "shirts", "knitwear"];
  const OPTIONAL = new Set(["outer", "mid", "acc"]);
  const IDS = SLOTS.map((s) => s[0]);
  const fam = (g) => g.colorFamily || family(g.color);
  const lab = (g) => (/^#[0-9a-f]{6}$/i.test(g.color || "") ? oklch(g.color) : null);
  // Strong colour: a real hue with some punch. Neutrals and soft denim go with anything.
  const strong = (g) => { const f = fam(g), o = lab(g); return !!(f && o && !NEUTRAL.has(f) && o.c >= 0.1); };
  const canSlot = (g, s) => ({
    outer: g.category === "outerwear",
    top: TOPS.includes(g.category),
    mid: TOPS.includes(g.category) && (g.layer === "mid" || (g.category === "knitwear" && g.layer !== "base")),
    one: g.category === "one-piece",
    bottom: g.category === "trousers" || g.category === "bottoms",
    shoes: g.category === "shoes",
    acc: g.category === "accessories",
  })[s];
  const homeSlot = (g) => IDS.find((s) => s !== "mid" && canSlot(g, s));
  // Can go under a mid layer: a tee or shirt, not a knit or an overshirt.
  const base = (g) => !!g && g.layer !== "mid" && g.layer !== "outer" && !(g.category === "knitwear" && g.layer !== "base");
  const target = (ctx) => (OCCASIONS.find((o) => o[0] === ctx.occasion) || OCCASIONS[0])[2];
  function fits(g, ctx) {
    const st = g.status || "owned";
    if (st !== "owned" && !(ctx.wishlist && st === "wishlist")) return false;
    if (ctx.season && (g.seasons || []).length && !g.seasons.includes(ctx.season)) return false;
    const t = target(ctx);
    return !(t && g.formality && Math.abs(g.formality - t) > 1);
  }
  const lookup = (all) => { const m = new Map(all.map((g) => [g.id, g])); return (id) => (id ? m.get(id) || null : null); };
  const list = (o, find) => IDS.map((s) => find(o[s])).filter(Boolean);
  const sig = (o) => IDS.map((s) => o[s] || "").join("|");

  // The rules. Returns the first one broken, or "".
  function broken(ps) {
    const f = ps.map((g) => g.formality).filter(Boolean);
    if (f.length > 1 && Math.max(...f) - Math.min(...f) > 2) return "formality";
    if (ps.filter(strong).length > 1) return "colour";
    if (ps.filter((g) => LOUD.has(g.pattern)).length > 1) return "pattern";
    const st = ps.filter((g) => (g.styles || []).length);
    if (st.length > 1 && st.some((g) => !st.some((h) => h !== g && h.styles.some((x) => g.styles.includes(x))))) return "style";
    return "";
  }
  const RULE = { formality: "the pieces are too far apart in formality", colour: "two strong colours", pattern: "two patterned pieces", style: "a piece shares no style with the rest" };

  const bigTop = (g) => ["oversized", "relaxed"].includes(g.fit) || g.silhouette === "boxy";
  const fittedTop = (g) => ["slim", "skinny"].includes(g.fit) || g.silhouette === "tailored";
  const wideLeg = (g) => g.silhouette === "wide" || ["oversized", "relaxed"].includes(g.fit);
  const narrowLeg = (g) => ["slim", "skinny"].includes(g.fit) || ["tapered", "skinny"].includes(g.silhouette);
  // 1: big top over narrow legs, 2: fitted top over wide legs, -1: big over wide.
  function proportion(o, find) {
    const up = find(o.mid) || find(o.top), low = find(o.bottom);
    if (!up || !low) return 0;
    if (bigTop(up) && narrowLeg(low)) return 1;
    if (fittedTop(up) && wideLeg(low)) return 2;
    if (bigTop(up) && wideLeg(low)) return -1;
    return 0;
  }
  // Higher is better. Colour counts most in the colour-matched modes.
  function score(o, ctx, mode, find) {
    const ps = list(o, find);
    const fams = ps.map(fam).filter(Boolean), n = new Set(fams).size;
    let c = n <= 2 ? 2 : n === 3 ? 1.5 : n === 4 ? 0 : -2;
    if (fams.length > n) c += 0.8; // a colour repeats
    const up = find(o.mid) || find(o.top), low = find(o.bottom);
    if (up && low && lab(up) && lab(low)) { const d = Math.abs(lab(up).l - lab(low).l); c += d >= 0.15 && d <= 0.65 ? 1.5 : d < 0.08 ? -0.5 : 0; }
    if (ps.filter(strong).length === 1 && ps.length >= 3) c += 0.8; // one accent on neutrals
    const sh = find(o.shoes), ac = find(o.acc), ou = find(o.outer);
    if (sh && ac && fam(sh) === fam(ac)) c += 1;
    if (sh && ou && fam(sh) === fam(ou)) c += 0.5;
    const p = proportion(o, find);
    let w = p > 0 ? 1.5 : p < 0 ? -1 : 0;
    if ((ctx.season === "winter" || ctx.season === "autumn") && o.outer) w += 1;
    if (ctx.season === "winter" && o.mid) w += 0.5;
    if (ctx.season === "summer" && (o.outer || o.mid)) w -= 1.5;
    for (const g of ps) if (ctx.season && (g.seasons || []).includes(ctx.season)) w += 0.2;
    const st = ps.filter((g) => (g.styles || []).length);
    if (ctx.style) w += 1.5 * ps.filter((g) => (g.styles || []).includes(ctx.style)).length;
    if (st.length > 1 && STYLES.some((x) => st.every((g) => g.styles.includes(x)))) w += 1;
    return (mode === "random" ? 0.3 : 1) * c + w;
  }

  const OUTER = { winter: 0.95, autumn: 0.8, spring: 0.5, summer: 0.1, "": 0.5 };
  const MID = { winter: 0.6, autumn: 0.45, spring: 0.25, summer: 0.05, "": 0.3 };
  const any = (a) => (a.length ? a[(Math.random() * a.length) | 0].id : null);
  function sample(ctx, pools, cur, locks, find) {
    // A locked slot keeps its piece; an optional slot can also be locked empty.
    const kept = (s) => !!locks[s] && (!!find(cur[s]) || (OPTIONAL.has(s) && !cur[s]));
    const o = {};
    for (const s of IDS) if (kept(s)) o[s] = cur[s] || null;
    const one = kept("one") ? true : kept("top") || kept("bottom") ? false
      : !pools.top.length || !pools.bottom.length ? pools.one.length > 0
      : Math.random() < Math.min(0.35, pools.one.length / (pools.one.length + Math.min(pools.top.length, pools.bottom.length)));
    if (one) { if (!kept("one")) o.one = any(pools.one); o.top = o.bottom = null; }
    else {
      o.one = null;
      if (!kept("bottom")) o.bottom = any(pools.bottom);
      if (!kept("top")) o.top = any(kept("mid") && o.mid ? pools.base.filter((g) => g.id !== o.mid) : pools.top);
    }
    if (!kept("mid")) o.mid = (one || base(find(o.top))) && Math.random() < MID[ctx.season || ""] ? any(pools.mid.filter((g) => g.id !== o.top)) : null;
    if (!kept("outer")) o.outer = Math.random() < Math.max(OUTER[ctx.season || ""], target(ctx) >= 4 ? 0.85 : 0) ? any(pools.outer) : null;
    if (!kept("shoes")) o.shoes = any(pools.shoes);
    if (!kept("acc")) o.acc = Math.random() < 0.5 ? any(pools.acc) : null;
    return o;
  }

  // all: every live piece. cur and locks: the outfit on screen and what is locked.
  // Returns { outfit, gaps } or { error }.
  function generate(all, ctx, mode, cur, locks, recent) {
    const find = lookup(all), pools = {};
    for (const s of IDS) pools[s] = all.filter((g) => canSlot(g, s) && fits(g, ctx));
    pools.base = pools.top.filter(base);
    const have = (s) => pools[s].length > 0 || (!!locks[s] && !!find(cur[s]));
    const none = (s) => {
      const what = slotNoun(s, true);
      if (!all.some((g) => canSlot(g, s) && fits(g, { wishlist: ctx.wishlist }))) return `No ${what} in your wardrobe yet`;
      const occ = (OCCASIONS.find((x) => x[0] === ctx.occasion) || OCCASIONS[0]);
      return `No ${what} for ${[ctx.season, occ[0] ? occ[1].toLowerCase() : ""].filter(Boolean).join(" and ")}`;
    };
    if (!have("one") && !(have("top") && have("bottom"))) return { error: none(!have("top") ? "top" : "bottom") + "." };
    const gaps = have("shoes") ? [] : [["shoes", none("shoes")]];
    const seen = new Map(), fails = {};
    for (let i = 0; i < 600; i++) {
      const o = sample(ctx, pools, cur, locks, find), k = sig(o);
      if (seen.has(k)) continue;
      const b = broken(list(o, find));
      if (b) { fails[b] = (fails[b] || 0) + 1; seen.set(k, null); continue; }
      seen.set(k, { o, s: score(o, ctx, mode, find) });
    }
    const ok = [...seen.entries()].filter((e) => e[1]);
    if (!ok.length) {
      const worst = Object.entries(fails).sort((a, b) => b[1] - a[1])[0];
      return { error: `Nothing passes: every combination has ${RULE[worst ? worst[0] : "colour"]}. Unlock a piece or change the options.` };
    }
    // Never one of the last few, unless nothing else is left.
    const now = sig(cur), fresh = ok.filter(([k]) => k !== now && !recent.includes(k)), notNow = ok.filter(([k]) => k !== now);
    const from = fresh.length ? fresh : notNow.length ? notNow : ok;
    const jitter = mode === "random" ? 10 : 0.8; // random: any outfit that passes, colour: the best few
    let best = null, bv = -Infinity;
    for (const [, x] of from) { const v = x.s + Math.random() * jitter; if (v > bv) { bv = v; best = x.o; } }
    return { outfit: best, gaps };
  }

  // Pieces for one slot: those that pass with the rest (best first), then the others.
  function options(all, ctx, mode, cur, slot) {
    const find = lookup(all), good = [], other = [];
    for (const g of all) {
      if (!canSlot(g, slot) || (g.status || "owned") === "archived") continue;
      const o = { ...cur, [slot]: g.id };

// ---------- Undo ----------
// Every write to a piece records what it looked like before. One tap on the
// round arrow puts the last action back. Photos are never erased from the
// device, so a removed photo comes back with its piece. Kept across restarts.
const Undo = (() => {
  let stack = pref.get("undo", []), open = null, busy = false;
  const keep = () => { stack = stack.slice(-30); pref.set("undo", stack); paint(); };
  function paint() {
    const b = $("#undo"); if (!b) return;
    const last = stack[stack.length - 1];
    b.disabled = !last || busy;
    b.title = last ? `Undo: ${last.label}` : "Nothing to undo";
    b.setAttribute("aria-label", b.title);
  }
  function note(id, before, col = "garments") {
    if (open) { if (!open.changes.some((c) => c.id === id && (c.col || "garments") === col)) open.changes.push({ id, before, col }); return; }
    stack.push({ label: "Last change", changes: [{ id, before, col }] }); keep();
  }
  // Groups every write inside fn into one undo step with this label.
  async function act(label, fn) {
    const prev = open, g = { label, changes: [] }; open = g;
    try { return await fn(); }
    finally { open = prev; if (g.changes.length) { stack.push(g); keep(); } }
  }
  async function undo() {
    if (busy || !stack.length) return null;
    const e = stack.pop(); busy = true; paint();
    try {
      for (const c of [...e.changes].reverse()) {
        const ref = S.db.collection(c.col || "garments").doc(c.id);
        if (c.before) await ref.set(c.before, { quiet: true });
        else await ref.update({ deleted: true, deletedAt: Date.now() }, { quiet: true }).catch(() => {});
      }
    } catch (err) { stack.push(e); throw err; }
    finally { busy = false; keep(); }
    return e;
  }
  return { note, act, undo, paint };
})();
async function doUndo() {
  if (!S.db) return;
  const r = route(), wasLive = new Set(live().map((g) => g.id));
  let e;
  try { e = await Undo.undo(); } catch { return toast("Undo failed. Try again."); }
  if (!e) return toast("Nothing to undo");
  await new Promise((res) => setTimeout(res)); // let the wardrobe list catch up
  S.edit = null; S.confirmDel = false; S.sheet = null; S.err = "";
  toast(`Undone: ${e.label}`);

  const ids = [...new Set(e.changes.map((c) => c.id))];
  const back = ids.length === 1 && (e.changes[0].col || "garments") === "garments" && e.changes[0].before && !e.changes[0].before.deleted && !wasLive.has(ids[0]);
  if (back) location.hash = "item-" + ids[0];

}

// Resize a photo in the browser before upload: a 1600px image for the detail
// view and a 600px one for the grid, plus the garment colour from the centre.
async function processPhoto(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
  let src = bmp;
  if (!src) {
    src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("unreadable")); i.src = URL.createObjectURL(file); });
  }
  const w = src.width, h = src.height;
  const draw = (max) => {
    const s = Math.min(1, max / Math.max(w, h));
    const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c;
  };
  const toBlob = (c, q) => new Promise((res) => c.toBlob((b) => res(b), "image/webp", q));
  const big = draw(1600), small = draw(600);
  let full = await toBlob(big, 0.86), thumb = await toBlob(small, 0.8);
  if (!full || full.type !== "image/webp") { // Safari without WebP encode
    full = await new Promise((r) => big.toBlob(r, "image/jpeg", 0.88));
    thumb = await new Promise((r) => small.toBlob(r, "image/jpeg", 0.82));
  }
  // Median colour of the centre: the garment, not the backdrop.
  const c = document.createElement("canvas"); c.width = 60; c.height = 60;
  const x = c.getContext("2d"); x.drawImage(src, 0, 0, 60, 60);
  const d = x.getImageData(18, 15, 24, 30).data, R = [], G = [], B = [];
  for (let i = 0; i < d.length; i += 4) { R.push(d[i]); G.push(d[i + 1]); B.push(d[i + 2]); }
  const med = (a) => a.sort((p, q) => p - q)[a.length >> 1];
  const color = "#" + [med(R), med(G), med(B)].map((v) => v.toString(16).padStart(2, "0")).join("");
  return { full, thumb, w, h, color };
}

    const val = Array.isArray(v) ? v[0] : v, lab = Array.isArray(v) ? v[1] : (labelFn ? labelFn(v) : v);

  const many = (k, list) => `<div class="chips">${list.map((v) => `<button type="button" class="chip cap1" data-many="${k}" data-v="${v}" aria-pressed="${arr(k).includes(v)}">${v}</button>`).join("")}</div>`;
  const row = (label, body, req) => `<div class="row"><span class="label">${label}${req ? " *" : ""}</span>${body}</div>`;
  const inp = (k, ph = "", extra = "") => `<input class="field" data-f="${k}" id="f-${k}" value="${esc(s(k))}" placeholder="${esc(ph)}" ${extra}>`;
  let h = row("Category", one("category", CATEGORIES, null, true), true)

    + row("Colour", `<div class="colour"><input type="color" id="f-color" value="${esc(s("color") || "#000000")}" aria-label="Main colour"><span class="mute">${s("color") ? `<span class="cap1">${esc(family(s("color")) || "")}</span>` : "Taken from the photo if left empty"}</span></div>`)
    + row("Status", one("status", STATUSES, null, true));
  if (full) {

      + row("Style", many("styles", STYLES)) + row("Formality", one("formality", [1, 2, 3, 4, 5].map((n) => [String(n), FORMALITY[n]]), null, true))

function bindFields(root, d, onChange) {
  root.querySelectorAll("[data-one]").forEach((b) => b.onclick = () => {
    const k = b.dataset.one, v = b.dataset.v;
    d[k] = String(d[k]) === v && !["category", "status"].includes(k) ? "" : v;
    root.querySelectorAll(`[data-one="${k}"]`).forEach((x) => x.setAttribute("aria-pressed", String(d[k]) === x.dataset.v));
    onChange();
  });
  root.querySelectorAll("[data-many]").forEach((b) => b.onclick = () => {
    const k = b.dataset.many, v = b.dataset.v, a = Array.isArray(d[k]) ? d[k] : [];
    d[k] = a.includes(v) ? a.filter((x) => x !== v) : [...a, v];
    b.setAttribute("aria-pressed", d[k].includes(v));
  });
  root.querySelectorAll("[data-f]").forEach((i) => i.oninput = () => {
    if (i.dataset.f === "tagsText") d.tags = i.value.split(",").map((t) => t.trim().toLowerCase()).filter(Boolean);
    else d[i.dataset.f] = i.value;
    onChange();
  });
  const c = root.querySelector("#f-color");
  if (c) c.oninput = () => { d.color = c.value; const sp = c.nextElementSibling; sp.innerHTML = `<span class="cap1">${esc(family(c.value) || "")}</span>`; };
}
function cleanRecord(d) {
  const out = {};
  for (const k of ["name", "brand", "category", "size", "color", "status", "fit", "silhouette", "layer", "pattern", "material", "collection", "bought", "notes"]) {
    const v = typeof d[k] === "string" ? d[k].trim() : d[k]; out[k] = v === "" || v == null ? null : v;
  }
  out.formality = d.formality ? Number(d.formality) : null;
  out.price = d.price && !isNaN(parseFloat(d.price)) ? parseFloat(d.price) : null;
  for (const k of ["seasons", "styles", "tags"]) out[k] = Array.isArray(d[k]) ? d[k] : [];
  out.colorFamily = family(out.color);
  out.status = out.status || "owned";
  return out;
}

async function saveBatch() {
  const B = S.batch;
  if (!B || B.busy) return;
  const todo = B.rows.filter((r) => !r.saved);
  if (!todo.length || !todo.every((r) => r.category || B.category)) return;
  B.busy = true; B.err = ""; B.done = 0; B.total = todo.length; viewBatch();
  // Number unnamed pieces after what is already in the wardrobe: "Shoes 3", "Shoes 4".
  const count = {};
  for (const g of S.items) if (!g.deleted) count[g.category] = (count[g.category] || 0) + 1;
  let lastErr = "";
  await Undo.act("Batch add", async () => { for (const r of todo) {
    const cat = r.category || B.category;
    try {
      const images = await uploadPhotos([r.file], "front");
      const name = r.name.trim() || `${catLabel(cat)} ${(count[cat] || 0) + 1}`;
      const rec = cleanRecord({ name, category: cat, brand: B.brand, status: "owned" });
      if (images[0]) { rec.color = images[0].color; rec.colorFamily = family(rec.color); }
      const now = Date.now();
      await S.db.collection("garments").doc(newId()).set({ ...rec, images, fav: false, deleted: false, createdAt: now, updatedAt: now });
      count[cat] = (count[cat] || 0) + 1;
      r.saved = true; B.done++;
    } catch (e) {
      // Keep going; a photo that failed stays in the list to retry.
      lastErr = uploadError(e);
    }
    if (route().v === "batch") viewBatch();
  } });
  B.busy = false;
  const failed = B.rows.filter((r) => !r.saved).length;
  if (!failed) { toast(`Added ${B.done} ${B.done === 1 ? "piece" : "pieces"}`); clearBatch(); location.hash = "wardrobe"; return; }
  B.err = `${failed} ${failed === 1 ? "photo was" : "photos were"} not saved. ${lastErr}`;
  if (route().v === "batch") viewBatch();
}

async function uploadPhotos(files, kindFirst) {
  const out = [];
  for (const [i, f] of files.entries()) {
    const p = await processPhoto(f);
    const a = await S.assets.upload(p.full);
    const t = await S.assets.upload(p.thumb);
    out.push({ id: a.id, thumb: t.id, w: p.w, h: p.h, kind: i === 0 ? kindFirst : "detail", color: p.color, source: "own" });
  }
  return out;
}
function uploadError(e) {
  const c = e && e.code;
  if (c === "too_large") return "That photo is too large. Try a smaller one.";
  if (c === "unsupported_type") return "That file type is not supported. Use a JPEG, PNG or WebP photo.";
  if (c === "quota_or_state") return "Photo storage is full.";
  if (c === "rate_limited") return "Too many uploads at once. Wait a moment and save again.";
  if (e && e.message === "unreadable") return "That photo could not be read. iPhone HEIC photos: choose 'Most compatible' in camera settings, or send a JPEG.";
  return "Saving failed. Check your connection and try again.";
}
async function saveNew(again) {
  const d = S.draft;
  if (S.busy || !(d.name || "").trim() || !d.category) return;
  S.busy = true; S.err = ""; viewAdd();
  try {
    const images = S.files.length && S.assets ? await uploadPhotos(S.files.map((f) => f.file), "front") : [];
    const rec = cleanRecord(d);
    if (!rec.color && images[0]) { rec.color = images[0].color; rec.colorFamily = family(rec.color); }
    const id = newId(), now = Date.now();
    await Undo.act("Piece added", () => S.db.collection("garments").doc(id).set({ ...rec, images, fav: false, deleted: false, createdAt: now, updatedAt: now }));
    S.busy = false;
    if (again) { newDraft({ category: d.category, brand: d.brand, status: d.status }); toast("Saved"); viewAdd(); window.scrollTo(0, 0); }
    else { S.draft = null; location.hash = "item-" + id; }
  } catch (e) {
    S.busy = false; S.err = uploadError(e); viewAdd();
  }
}

// One change to a piece, as one undo step named by its message.
async function saveItem(g, patch, msg, withUndo) {

  catch (e) { S.err = "Saving failed. Check your connection and try again."; }
  S.busy = false; render();
}

    $("#rmimg").onclick = () => { const a = imgs.filter((_, j) => j !== i); S.slide = Math.max(0, i - 1); S.sheet = null; saveItem(g, { images: a }, "Photo removed", true); };

      S.studioBusy = true; StudioQ.manual = true; $("#studio").disabled = true; label("Preparing");
      try {
        await makeStudio(g.id, im.id, (stepName, p) => label(stepName === "download" ? `Loading ${Math.round(p * 100)}%` : "Cutting out"));
        S.sheet = null; toast("Studio photo ready");
      } catch (err) {

      } finally { S.studioBusy = false; S.studioMsg = ""; StudioQ.manual = false; kickStudio(); render(); }

  if (S.sheet === "removed") {

    <div class="sheet" role="dialog" aria-label="Removed photos">
      ${head("Removed photos")}

      const p = removedCache[+b.dataset.put]; if (!p || S.busy) return;
      b.disabled = true;
      try {

        const pr = await processPhoto(p.blob), t = await S.assets.upload(pr.thumb);

  S.sheet = null; L.innerHTML = "";

// The generator on top: one grey well with the pieces laid out head to toe,
// each with a lock and a swap. Saved outfits below. Season starts on today's.
S.fit = {
  mode: pref.get("fitMode", "colour"),
  ctx: { season: thisSeason(), occasion: pref.get("fitOcc", ""), style: pref.get("fitStyle", ""), wishlist: pref.get("fitWish", false) },
  cur: pref.get("fitCur", {}), locks: pref.get("fitLocks", {}), recent: pref.get("fitRecent", []),
  err: "", gaps: [], sheet: null, auto: false,
};
S.outfits = [];
const FIT_ICON = {
  lock: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`,
  open: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>`,
  swap: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><path d="M4 9h14l-4-4"/><path d="M20 15H6l4 4"/></svg>`,
};
const fitPool = () => live().filter((g) => (g.status || "owned") !== "archived");
function saveFit() {
  const F = S.fit;
  pref.set("fitMode", F.mode); pref.set("fitOcc", F.ctx.occasion); pref.set("fitStyle", F.ctx.style); pref.set("fitWish", F.ctx.wishlist);
  pref.set("fitCur", F.cur); pref.set("fitLocks", F.locks); pref.set("fitRecent", F.recent);
}
// Pieces deleted since are dropped from the outfit on screen.
function cleanFit() {
  const F = S.fit;
  for (const s of Outfit.IDS) if (F.cur[s] && !byId(F.cur[s])) { F.cur[s] = null; delete F.locks[s]; }
}
const fitEmpty = () => !Outfit.IDS.some((s) => S.fit.cur[s]);
function shuffleFit() {
  const F = S.fit;
  cleanFit();
  const r = Outfit.generate(fitPool(), F.ctx, F.mode, F.cur, F.locks, F.recent);
  if (r.error) { F.err = r.error; F.gaps = []; }
  else {
    F.err = ""; F.gaps = r.gaps; F.cur = r.outfit;
    F.recent = [Outfit.sig(r.outfit), ...F.recent.filter((k) => k !== Outfit.sig(r.outfit))].slice(0, 8);
  }
  saveFit();
}
// Put one piece in its slot and lock it (choosing, or building around a piece).
function placeFit(g, slot) {
  const F = S.fit;
  F.cur = { ...F.cur, [slot]: g ? g.id : null };
  if (slot === "one" && g) F.cur.top = F.cur.bottom = null;
  if ((slot === "top" || slot === "bottom") && g) F.cur.one = null;
  if (g && slot !== "mid" && F.cur.mid === g.id) F.cur.mid = null;
  if (g && slot === "mid" && F.cur.top === g.id) F.cur.top = null;
  F.locks = { ...F.locks, [slot]: true };
  // A slot left empty by the change is filled at once.
  const need = !F.cur.one && !(F.cur.top && F.cur.bottom);
  if (need) shuffleFit(); else { F.err = ""; saveFit(); }
}
function buildAround(g) {
  const F = S.fit, slot = Outfit.homeSlot(g);
  F.mode = "around"; F.center = g.id;
  F.cur = { [slot]: g.id }; F.locks = { [slot]: true };
  shuffleFit();
  location.hash = "outfits";
}

  const im = g && shown(g.images?.[0]);

// ---------- Storage on this device (IndexedDB) ----------
// Same shape as the cloud store the app was written against, so moving to
// an online database later swaps this block only.
const Local = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    // Version 2 added "outfits". Never lower this number: an older request fails to open a newer database.
    const r = indexedDB.open("rail", 2);
    r.onupgradeneeded = () => { for (const n of ["garments", "blobs", "outfits"]) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); };
    // Another open copy on an older version holds the database until it closes or reloads.
    r.onblocked = () => { S.failed = "blocked"; render(); };
    r.onsuccess = () => { const d = r.result; d.onversionchange = () => { d.close(); location.reload(); }; S.failed = ""; res(d); };

      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);

  };

  const data = Object.fromEntries(COLS.map((c) => [c, new Map()])), subs = Object.fromEntries(COLS.map((c) => [c, new Set()]));
  const items = data.garments;
  // One snapshot per collection per tick, however many writes happened in it.
  const pending = new Set();
  const emit = (col) => { if (pending.has(col)) return; pending.add(col); setTimeout(() => {
    pending.delete(col);
    const docs = [...data[col]].map(([id, v]) => ({ id, exists: true, data: () => v, metadata: { fromCache: false } }));
    subs[col].forEach((fn) => fn({ docs, metadata: { fromCache: false, hasPendingWrites: false } }));

      async update(p, o = {}) {

    collection: (col) => {
      if (!data[col]) throw new Error("unknown collection " + col);
      return { doc: (id) => ref(col, id), onSnapshot(fn) { subs[col].add(fn); emit(col); return () => subs[col].delete(fn); } };
    },
    doc: () => ({ async get() { return { exists: false, data: () => undefined }; }, onSnapshot() { return () => {}; } }),
  };

    async upload(blob) {
      const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
      await run("blobs", "readwrite", (s) => s.put(blob, id));
      URLS.set(id, URL.createObjectURL(blob));
      return { id, url: URLS.get(id) };
    },
  };
  // Photos on the device that no piece points at any more (removed photos).
  // Only full-size originals: grid thumbnails are at most 600 px on the long side.
  const dims = new Map();
  async function removedPhotos() {
    const used = new Set([...items.values()].flatMap((g) => (g.images || []).flatMap((i) => [i.id, i.thumb, i.studio && i.studio.id, i.studio && i.studio.thumb])));
    const out = [];
    for (const [id, b] of await entries("blobs")) {
      if (used.has(id)) continue;
      if (!dims.has(id)) { const bm = await createImageBitmap(b).catch(() => null); dims.set(id, bm ? { w: bm.width, h: bm.height } : null); bm && bm.close && bm.close(); }

})();

// ---------- Backup and restore ----------
const toDataUrl = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function backup() {
  const b = $("#backup"); b.disabled = true; b.textContent = "Preparing backup";
  try {
    const garments = Object.fromEntries(await Local.entries("garments"));
    const used = new Set(Object.values(garments).flatMap((g) => (g.images || []).flatMap((i) => [i.id, i.thumb, i.studio && i.studio.id, i.studio && i.studio.thumb].filter(Boolean))));
    const photos = {};
    for (const [id, blob] of await Local.entries("blobs")) if (used.has(id)) photos[id] = await toDataUrl(blob);
    const name = "rail-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    const outfits = Object.fromEntries(await Local.entries("outfits"));
    const file = new File([JSON.stringify({ app: "RAIL", version: 1, savedAt: new Date().toISOString(), garments, outfits, photos })], name, { type: "application/json" });
    // Phones: the share sheet (Save to Files, Drive, AirDrop). Computers: a download.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "RAIL backup" }); toast("Backup ready"); }
      catch (e) { if (e && e.name !== "AbortError") throw e; }
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("Backup saved");
    }
  } catch { toast("Backup failed. Try again."); }
  b.disabled = false; b.textContent = "Back up wardrobe";
}
async function restore(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "RAIL" || !data.garments) throw new Error("not a backup");
    const blobs = [];
    for (const [id, url] of Object.entries(data.photos || {})) blobs.push([id, await (await fetch(url)).blob()]);
    await Undo.act("Backup restored", () => Local.replaceAll(Object.entries(data.garments), blobs, Object.entries(data.outfits || {})));
    toast(`Restored ${Object.keys(data.garments).length} pieces`);
    location.hash = "wardrobe";
  } catch { toast("That file is not a RAIL backup."); }
}

// ---------- Studio photos ----------
// Cuts the garment out on this device with U-2-Netp (a small open model, 4.6 MB,
// Apache 2.0, served from models/ and kept in the browser cache), then centres it
// on a transparent 4:5 canvas with a soft shadow. The grey well behind every
// photo shows through, so studio shots line up like a shop's product pages.
// Nothing leaves the phone, and the original photo is always kept.
const Studio = (() => {
  const ORT = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/";

      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      if (onProgress) onProgress(Math.min(1, got / total));

    return blob.arrayBuffer();

      const ort = await import(ORT + "ort.wasm.min.mjs");
      ort.env.wasm.wasmPaths = ORT;
      // Run the model in a worker so the app stays responsive while it works.
      ort.env.wasm.proxy = true;
      const s = await ort.InferenceSession.create(await modelBytes(onProgress), { executionProviders: ["wasm"] });
      return { ort, s };

    const b = await new Promise((r) => c.toBlob(r, "image/webp", 0.88));
    return b && b.type === "image/webp" ? b : new Promise((r) => c.toBlob(r, "image/png")); // PNG keeps transparency on Safari
  };

    const bmp = await createImageBitmap(blob, { imageOrientation: "from-image" }).catch(() => null);

    const px = mx.getImageData(0, 0, N, N).data, input = new Float32Array(3 * N * N), P = N * N;
    for (let i = 0, j = 0; i < px.length; i += 4, j++) {
      input[j] = (px[i] / 255 - 0.485) / 0.229; input[j + P] = (px[i + 1] / 255 - 0.456) / 0.224; input[j + 2 * P] = (px[i + 2] / 255 - 0.406) / 0.225;
    }
    const out = await s.run({ [s.inputNames[0]]: new ort.Tensor("float32", input, [1, 3, N, N]) });
    const v = out[s.outputNames[0]].data;
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < v.length; i++) { if (v[i] < lo) lo = v[i]; if (v[i] > hi) hi = v[i]; }
    const md = mx.createImageData(N, N), range = hi - lo || 1;
    for (let i = 0; i < v.length; i++) {
      // Firm up the edge: values near 0 or 1 snap to clear or solid.
      md.data[i * 4 + 3] = Math.round(255 * Math.max(0, Math.min(1, ((v[i] - lo) / range - 0.1) / 0.8)));
    }
    mx.putImageData(md, 0, 0);
    // 2. Apply the mask to the photo (at most 1600 px on the long side)
    const sc = Math.min(1, 1600 / Math.max(src.width, src.height));
    const W = Math.round(src.width * sc), H = Math.round(src.height * sc);
    const p = canvas(W, H), pc = p.getContext("2d", { willReadFrequently: true });
    pc.imageSmoothingQuality = "high";
    pc.drawImage(m, 0, 0, W, H);
    pc.globalCompositeOperation = "source-in";
    pc.drawImage(src, 0, 0, W, H);
    pc.globalCompositeOperation = "source-over";
    // 3. Bounding box of the garment
    const a = pc.getImageData(0, 0, W, H).data;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (a[(y * W + x) * 4 + 3] > 96) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0 || (x1 - x0) * (y1 - y0) < W * H * 0.01) throw new Error("nothing found");
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    // 4. Centre on the 4:5 canvas with a soft shadow
    const k = Math.min((OUT_W * 0.82) / bw, (OUT_H * 0.84) / bh);
    const dw = Math.round(bw * k), dh = Math.round(bh * k), dx = Math.round((OUT_W - dw) / 2), dy = Math.round((OUT_H - dh) / 2);
    const o = canvas(OUT_W, OUT_H), ox = o.getContext("2d");
    ox.imageSmoothingQuality = "high";
    ox.shadowColor = "rgba(0,0,0,0.20)"; ox.shadowBlur = 36; ox.shadowOffsetY = 16;
    ox.drawImage(p, x0, y0, bw, bh, dx, dy, dw, dh);
    const t = canvas(480, 600), tx = t.getContext("2d");
    tx.imageSmoothingQuality = "high";
    tx.drawImage(o, 0, 0, 480, 600);
    return { full: await encode(o), thumb: await encode(t), w: OUT_W, h: OUT_H };
  }
  return { make };
})();

// ---------- Studio by default ----------
// Every photo gets a studio version in the background, one at a time, oldest
// pieces first. The original is kept; the piece view switches back in one tap.
const StudioQ = { busy: false, manual: false, current: null, skip: new Set() };
const needsStudio = (im) => im && !im.studio && !im.studioNone && !StudioQ.skip.has(im.id);
async function makeStudio(gid, imgId, onStep) {
  const src = await (await fetch(blobUrl(imgId))).blob();
  let out;
  try { out = await Studio.make(src, onStep); }
  catch (e) {
    // Nothing recognisable in the photo: remember, so it is not tried again on every start.
    if (e && e.message === "nothing found") {
      const g = byId(gid);
      if (g) await S.db.collection("garments").doc(gid).update({ images: g.images.map((x) => (x.id === imgId ? { ...x, studioNone: true } : x)) }, { quiet: true });
    }
    throw e;
  }
  const a = await S.assets.upload(out.full), t = await S.assets.upload(out.thumb);
  const g = byId(gid);
  if (!g) return;
  const images = (g.images || []).map((x) => (x.id === imgId ? { ...x, studio: { id: a.id, thumb: t.id, w: out.w, h: out.h }, studioNone: false } : x));
  // Background work, not the person's action: kept out of the undo history.
  await S.db.collection("garments").doc(gid).update({ images }, { quiet: true });
}
async function runStudioQueue() {
  if (StudioQ.busy || StudioQ.manual || !S.db || !S.assets) return;
  StudioQ.busy = true;
  try {
    for (;;) {
      if (StudioQ.manual) break;
      const g = live().slice().sort((x, y) => (x.createdAt || 0) - (y.createdAt || 0)).find((x) => (x.images || []).some(needsStudio));
      if (!g) break;
      const im = g.images.find(needsStudio);
      StudioQ.current = im.id;
      // Wait one tick so S.items carries the new studio photo before the next pick.
      try { await makeStudio(g.id, im.id); await new Promise((r) => setTimeout(r, 0)); }
      catch (e) { StudioQ.skip.add(im.id); if (!(e && e.message === "nothing found") && !navigator.onLine) break; }
    }
  } finally { StudioQ.busy = false; StudioQ.current = null; }
  if (route().v === "item" && !S.edit) render();
}
const kickStudio = () => setTimeout(runStudioQueue, 800);
window.addEventListener("online", () => { StudioQ.skip.clear(); kickStudio(); });

// Fade photos in once loaded; mark ones that fail instead of showing a broken icon.
document.addEventListener("load", (e) => { if (e.target.tagName === "IMG" && e.target.closest(".well")) e.target.classList.add("on"); }, true);
document.addEventListener("error", (e) => {
  const w = e.target.tagName === "IMG" && e.target.closest(".well");
  if (w && !w.querySelector(".none")) w.insertAdjacentHTML("beforeend", `<div class="none label mute">Photo missing</div>`);
}, true);

// ---------- Boot: render at once, light up when the store answers ----------
if (route().v === "add") newDraft();
render();
$("#update-btn").onclick = applyUpdate;
$("#undo").onclick = doUndo;
(async () => {
  try {
    await Local.load();
    S.db = Local.db; S.assets = Local.assets; S.canWrite = true;
    Undo.paint();
    render();
    S.db.collection("outfits").onSnapshot((snap) => {
      S.outfits = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (route().v === "outfits") render();
    });
    S.db.collection("garments").onSnapshot((snap) => {
      S.items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      S.loaded = true;
      kickStudio();
      const r = route();
      if (S.edit || r.v === "add" || r.v === "batch") return;
      const typing = document.activeElement && document.activeElement.matches("input, textarea, select");
      if (typing) { if (r.v === "wardrobe") { renderGrid(); updateCount(); } return; }
      if (S.filterOpen) { renderLayer(); renderGrid(); updateCount(); return; }
      render();
    });
  } catch (e) {
    S.failed = "nodb"; render();
  }
  registerUpdater();
})();
</script>
